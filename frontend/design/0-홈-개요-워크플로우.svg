<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1596" viewBox="0 0 1440 1596" font-family="Pretendard, 'Pretendard Variable', 'Noto Sans KR', system-ui, sans-serif">
<style>text{font-family:Pretendard, 'Pretendard Variable', 'Noto Sans KR', system-ui, sans-serif;white-space:pre}</style>
<rect x="0" y="0" width="1440" height="1596" rx="0" fill="#f3f1ec" stroke="none" stroke-width="1"/>
<rect x="240.5" y="8.5" width="1191" height="1579" rx="14" fill="#ffffff" stroke="#e7e4dd" stroke-width="1"/>
<g transform="translate(24 24)"><circle cx="14" cy="14" r="9.5" fill="none" stroke="#b4501f" stroke-width="3" stroke-dasharray="48 12" transform="rotate(-70 14 14)"/><path d="M20.5 4.5 L25 9.5 L18 11 Z" fill="#b4501f"/></g>
<text x="64" y="38" font-size="16" font-weight="600" fill="#1a1a18" text-anchor="start" >설문 폐루프</text>
<text x="64" y="56" font-size="12" font-weight="400" fill="#5c5a54" text-anchor="start" >일회용 카메라 · 인스탁스</text>
<text x="24" y="112" font-size="12" font-weight="400" fill="#5c5a54" text-anchor="start" >화면</text>
<rect x="12" y="124" width="208" height="32" rx="8" fill="#e8e5de" stroke="none" stroke-width="1"/>
<text x="28" y="145" font-size="14" font-weight="600" fill="#1a1a18" text-anchor="start" >홈(개요·워크플로우)</text>
<text x="28" y="181" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start" >제품군 대시보드</text>
<text x="28" y="217" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start" >액션플랜</text>
<text x="28" y="253" font-size="14" font-weight="400" fill="#5c5a54" text-anchor="start" >리포트</text>
<line x1="24" y1="1488" x2="216" y2="1488" stroke="#e7e4dd" stroke-width="1"/>
<text x="24" y="1512" font-size="12" font-weight="600" fill="#1a1a18" text-anchor="start" >읽기 전용</text>
<text x="24" y="1532" font-size="12" font-weight="400" fill="#5c5a54">설문 근거와 설문 수치는 합성</text>
<text x="24" y="1549" font-size="12" font-weight="400" fill="#5c5a54">응답입니다. 판정 기준 30건은 임시</text>
<text x="24" y="1566" font-size="12" font-weight="400" fill="#5c5a54">가정입니다.</text>
<g transform="translate(280 36) scale(1.15)"><circle cx="14" cy="14" r="9.5" fill="none" stroke="#b4501f" stroke-width="3" stroke-dasharray="48 12" transform="rotate(-70 14 14)"/><path d="M20.5 4.5 L25 9.5 L18 11 Z" fill="#b4501f"/></g>
<text x="322" y="58" font-size="18" font-weight="600" fill="#1a1a18" text-anchor="start" >설문 폐루프</text>
<text x="1392" y="58" font-size="12" font-weight="400" fill="#5c5a54" text-anchor="end" >읽기 전용 · 설문 근거와 설문 수치는 합성 응답</text>
<rect x="280" y="92" width="1112" height="312" rx="14" fill="#f7f5f0" stroke="none" stroke-width="1"/>
<circle cx="1182" cy="248" r="104" fill="none" stroke="#eee9e1" stroke-width="18"/>
<circle cx="1182" cy="248" r="104" fill="none" stroke="#b4501f" stroke-width="18" stroke-dasharray="522.8 653.5" transform="rotate(-70 1182 248)"/>
<path d="M1216 122 L1244 146 L1206 160 Z" fill="#b4501f"/>
<text x="1182" y="246" font-size="15" font-weight="600" fill="#1a1a18" text-anchor="middle" >다시 처음으로</text>
<text x="1182" y="268" font-size="12" font-weight="400" fill="#5c5a54" text-anchor="middle" >다음 회차 문항</text>
<text x="328" y="164" font-size="13" font-weight="600" fill="#b4501f" text-anchor="start" >정기 설문 폐루프 에이전트</text>
<text x="328" y="220" font-size="38" font-weight="700" fill="#1a1a18" text-anchor="start" letter-spacing="-0.8">묻고, 모으고, 읽고,</text>
<text x="328" y="268" font-size="38" font-weight="700" fill="#1a1a18" text-anchor="start" letter-spacing="-0.8">다시 묻습니다.</text>
<text x="328" y="304" font-size="15" font-weight="400" fill="#5c5a54">고객 설문과 리뷰를 모아 개선 제안 초안을 만들고, 그 결과가 다음 회차 설문 문항으로</text>
<text x="328" y="327" font-size="15" font-weight="400" fill="#5c5a54">이어집니다.</text>
<rect x="328" y="350" width="148" height="36" rx="8" fill="#1a1a18" stroke="none" stroke-width="1"/>
<text x="402" y="373" font-size="14" font-weight="600" fill="#fff" text-anchor="middle" >대시보드 보기</text>
<rect x="488.5" y="350.5" width="120" height="35" rx="8" fill="#fff" stroke="#d6d2c8" stroke-width="1"/>
<text x="548" y="373" font-size="14" font-weight="500" fill="#1a1a18" text-anchor="middle" >사용법 보기</text>
<text x="280" y="460" font-size="20" font-weight="600" fill="#1a1a18" text-anchor="start" >전체 흐름</text>
<text x="1392" y="460" font-size="12" font-weight="400" fill="#5c5a54" text-anchor="end" >n8n 워크플로우</text>
<rect x="280.5" y="476.5" width="1111" height="299" rx="12" fill="#f7f5f0" stroke="#d6d2c8" stroke-width="1" stroke-dasharray="6 5"/>
<text x="836" y="620" font-size="18" font-weight="600" fill="#5c5a54" text-anchor="middle" >n8n 워크플로우 이미지</text>
<text x="836" y="646" font-size="13" font-weight="400" fill="#5c5a54" text-anchor="middle" >아직 구현 전입니다 · 구현 후 이 자리에 화면 캡처로 교체합니다</text>
<text x="280" y="832" font-size="20" font-weight="600" fill="#1a1a18" text-anchor="start" >한 바퀴는 이렇게 돕니다</text>
<rect x="280.5" y="850.5" width="208.6" height="139" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="298" y="884" font-size="15" font-weight="600" fill="#1a1a18" text-anchor="start" >광고성 판정</text>
<rect x="298" y="896" width="33" height="22" rx="11" fill="#f8e9df" stroke="none" stroke-width="1"/>
<text x="307" y="911" font-size="12" font-weight="500" fill="#b4501f" text-anchor="start" >AI</text>
<text x="298" y="944" font-size="13" font-weight="400" fill="#5c5a54">리뷰 중 광고·홍보성 글을</text>
<text x="298" y="964" font-size="13" font-weight="400" fill="#5c5a54">AI가 가려냅니다.</text>
<rect x="506.1" y="850.5" width="208.6" height="139" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="523.6" y="884" font-size="15" font-weight="600" fill="#1a1a18" text-anchor="start" >집계</text>
<rect x="523.6" y="896" width="41" height="22" rx="11" fill="#efece5" stroke="none" stroke-width="1"/>
<text x="532.6" y="911" font-size="12" font-weight="500" fill="#3d3b36" text-anchor="start" >코드</text>
<text x="523.6" y="944" font-size="13" font-weight="400" fill="#5c5a54">건수·비율·순위 같은 숫자는</text>
<text x="523.6" y="964" font-size="13" font-weight="400" fill="#5c5a54">코드가 계산합니다.</text>
<rect x="731.7" y="850.5" width="208.6" height="139" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="749.2" y="884" font-size="15" font-weight="600" fill="#1a1a18" text-anchor="start" >액션플랜</text>
<rect x="749.2" y="896" width="33" height="22" rx="11" fill="#f8e9df" stroke="none" stroke-width="1"/>
<text x="758.2" y="911" font-size="12" font-weight="500" fill="#b4501f" text-anchor="start" >AI</text>
<text x="749.2" y="944" font-size="13" font-weight="400" fill="#5c5a54">계산된 표를 보고 AI가 개선</text>
<text x="749.2" y="964" font-size="13" font-weight="400" fill="#5c5a54">제안 초안을 씁니다. 문장마다</text>
<text x="749.2" y="984" font-size="13" font-weight="400" fill="#5c5a54">근거 건수가 붙습니다.</text>
<rect x="957.3" y="850.5" width="208.6" height="139" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="974.8" y="884" font-size="15" font-weight="600" fill="#1a1a18" text-anchor="start" >다음 회차 문항 초안</text>
<rect x="974.8" y="896" width="33" height="22" rx="11" fill="#f8e9df" stroke="none" stroke-width="1"/>
<text x="983.8" y="911" font-size="12" font-weight="500" fill="#b4501f" text-anchor="start" >AI</text>
<text x="974.8" y="944" font-size="13" font-weight="400" fill="#5c5a54">순위가 불확실하면 다음</text>
<text x="974.8" y="964" font-size="13" font-weight="400" fill="#5c5a54">설문에서 다시 묻도록 문항</text>
<text x="974.8" y="984" font-size="13" font-weight="400" fill="#5c5a54">초안을 만듭니다.</text>
<rect x="1182.9" y="850.5" width="208.6" height="139" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="1200.4" y="884" font-size="15" font-weight="600" fill="#1a1a18" text-anchor="start" >리포트 조립</text>
<rect x="1200.4" y="896" width="41" height="22" rx="11" fill="#efece5" stroke="none" stroke-width="1"/>
<text x="1209.4" y="911" font-size="12" font-weight="500" fill="#3d3b36" text-anchor="start" >코드</text>
<text x="1200.4" y="944" font-size="13" font-weight="400" fill="#5c5a54">제안과 문항을 한 리포트로 묶어</text>
<text x="1200.4" y="964" font-size="13" font-weight="400" fill="#5c5a54">HTML 한 파일로 내보낼 수</text>
<text x="1200.4" y="984" font-size="13" font-weight="400" fill="#5c5a54">있습니다.</text>
<rect x="280.5" y="1006.5" width="1111" height="51" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="300" y="1037" font-size="14" font-weight="500" fill="#1a1a18" text-anchor="start" >숫자는 코드가 계산하고, AI는 글만 씁니다. AI가 쓴 초안은 담당자가 검토하고 수정해야 하는 초안입니다.</text>
<text x="280" y="1114" font-size="20" font-weight="600" fill="#1a1a18" text-anchor="start" >화면별 안내</text>
<rect x="280.5" y="1132.5" width="359" height="155" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="300" y="1168" font-size="16" font-weight="600" fill="#1a1a18" text-anchor="start" >제품군 대시보드</text>
<text x="300" y="1196" font-size="14" font-weight="400" fill="#5c5a54">판정이 끝난 리뷰의 건수, 평균 평점, 평점 분포를</text>
<text x="300" y="1218" font-size="14" font-weight="400" fill="#5c5a54">봅니다. 판정된 글이 30건 미만이면 노란 안내가 먼저</text>
<text x="300" y="1240" font-size="14" font-weight="400" fill="#5c5a54">뜹니다.</text>
<text x="300" y="1268" font-size="13" font-weight="600" fill="#b4501f" text-anchor="start" >제품군 대시보드 열기  →</text>
<rect x="656.5" y="1132.5" width="359" height="155" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="676" y="1168" font-size="16" font-weight="600" fill="#1a1a18" text-anchor="start" >액션플랜</text>
<text x="676" y="1196" font-size="14" font-weight="400" fill="#5c5a54">영역별 개선 제안과 AI 초안을 봅니다. 문장마다 근거</text>
<text x="676" y="1218" font-size="14" font-weight="400" fill="#5c5a54">건수가 있고, 눌러서 근거 목록을 볼 수 있습니다.</text>
<text x="676" y="1240" font-size="14" font-weight="400" fill="#5c5a54">[확인 필요] 칸은 담당자가 채웁니다.</text>
<text x="676" y="1268" font-size="13" font-weight="600" fill="#b4501f" text-anchor="start" >액션플랜 열기  →</text>
<rect x="1032.5" y="1132.5" width="359" height="155" rx="10" fill="#fff" stroke="#e7e4dd" stroke-width="1"/>
<text x="1052" y="1168" font-size="16" font-weight="600" fill="#1a1a18" text-anchor="start" >리포트</text>
<text x="1052" y="1196" font-size="14" font-weight="400" fill="#5c5a54">액션플랜과 다음 회차 설문지(초안)를 한 곳에서</text>
<text x="1052" y="1218" font-size="14" font-weight="400" fill="#5c5a54">봅니다. 「내보내기 (HTML 한 파일)」로 저장할 수</text>
<text x="1052" y="1240" font-size="14" font-weight="400" fill="#5c5a54">있습니다.</text>
<text x="1052" y="1268" font-size="13" font-weight="600" fill="#b4501f" text-anchor="start" >리포트 열기  →</text>
<text x="280" y="1344" font-size="20" font-weight="600" fill="#1a1a18" text-anchor="start" >사용법</text>
<rect x="280.5" y="1362.5" width="265" height="137" rx="10" fill="#f7f5f0" stroke="none" stroke-width="1"/>
<text x="298" y="1396" font-size="22" font-weight="600" fill="#b4501f" text-anchor="start" style="font-variant-numeric: tabular-nums" >1</text>
<text x="320" y="1396" font-size="14" font-weight="600" fill="#1a1a18" text-anchor="start" >제품군과 회차 고르기</text>
<text x="298" y="1424" font-size="13" font-weight="400" fill="#5c5a54">화면 오른쪽 위에서 제품군과 회차를</text>
<text x="298" y="1444" font-size="13" font-weight="400" fill="#5c5a54">고르면 화면이 바뀝니다. 모든 화면은</text>
<text x="298" y="1464" font-size="13" font-weight="400" fill="#5c5a54">읽기 전용입니다.</text>
<rect x="562.5" y="1362.5" width="265" height="137" rx="10" fill="#f7f5f0" stroke="none" stroke-width="1"/>
<text x="580" y="1396" font-size="22" font-weight="600" fill="#b4501f" text-anchor="start" style="font-variant-numeric: tabular-nums" >2</text>
<text x="602" y="1396" font-size="14" font-weight="600" fill="#1a1a18" text-anchor="start" >표시부터 확인하기</text>
<text x="580" y="1424" font-size="13" font-weight="400" fill="#5c5a54">"합성", "표본 적음", "임시 가정"</text>
<text x="580" y="1444" font-size="13" font-weight="400" fill="#5c5a54">표시는 숫자를 읽는 조건입니다. 먼저</text>
<text x="580" y="1464" font-size="13" font-weight="400" fill="#5c5a54">확인하세요.</text>
<rect x="844.5" y="1362.5" width="265" height="137" rx="10" fill="#f7f5f0" stroke="none" stroke-width="1"/>
<text x="862" y="1396" font-size="22" font-weight="600" fill="#b4501f" text-anchor="start" style="font-variant-numeric: tabular-nums" >3</text>
<text x="884" y="1396" font-size="14" font-weight="600" fill="#1a1a18" text-anchor="start" >[확인 필요] 칸 채우기</text>
<text x="862" y="1424" font-size="13" font-weight="400" fill="#5c5a54">AI 초안의 이 칸은 우리 쪽 사실을 직접</text>
<text x="862" y="1444" font-size="13" font-weight="400" fill="#5c5a54">확인해 채워야 합니다. 채우기 전에는</text>
<text x="862" y="1464" font-size="13" font-weight="400" fill="#5c5a54">고객에게 쓰지 않습니다.</text>
<rect x="1126.5" y="1362.5" width="265" height="137" rx="10" fill="#f7f5f0" stroke="none" stroke-width="1"/>
<text x="1144" y="1396" font-size="22" font-weight="600" fill="#b4501f" text-anchor="start" style="font-variant-numeric: tabular-nums" >4</text>
<text x="1166" y="1396" font-size="14" font-weight="600" fill="#1a1a18" text-anchor="start" >확인 문항으로 이어가기</text>
<text x="1144" y="1424" font-size="13" font-weight="400" fill="#5c5a54">"확인 문항" 링크로 다음 회차 문항 1번을</text>
<text x="1144" y="1444" font-size="13" font-weight="400" fill="#5c5a54">보고, 리포트에서 내보내 공유합니다.</text>
<line x1="280" y1="1540" x2="1392" y2="1540" stroke="#e7e4dd" stroke-width="1"/>
<text x="280" y="1568" font-size="12" font-weight="400" fill="#5c5a54" text-anchor="start" >읽기 전용 · 설문 근거와 설문 수치는 합성 응답 · 판정 기준 30건은 임시 가정</text>
</svg>